<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Automated Phone System</title>
  <style>
    /* 🟢 Matrix Gradient Effect */
    .matrix-vibe {
      color: #00ff66;
text-shadow: 0 0 8px #00ff66, 0 0 15px #008833;
    }

    .version-tag {
      position: fixed;
      bottom: 10px;
      left: 10px;
      font-family: sans-serif;
      font-size: 12px;
      color: #555;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f0f2f5;
      font-family: sans-serif;
    }

    .phone-container {
      width: 320px;
      background-color: #1a1a1a;
      padding: 25px;
      border-radius: 25px;
      box-shadow: 0px 10px 25px rgba(0,0,0,0.3);
    }

    #display {
      background-color: #000;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      margin-bottom: 25px;
      border: 2px solid #333;
    }

    #screen-text {
      font-size: 0.95rem;
      color: #00ff66;
      margin-bottom: 10px;
      min-height: 3.5em;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.3;
      white-space: pre-line;
    }

    #input-buffer {
      font-size: 1.6rem;
      color: #ffffff;
      font-weight: bold;
      letter-spacing: 3px;
      min-height: 1.4em;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .key {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      border: none;
      background-color: #333;
      color: white;
      font-size: 1.4rem;
      font-weight: bold;
      cursor: pointer;
      justify-self: center;
      transition: background-color 0.2s, transform 0.1s;
    }

    .key:hover {
      background-color: #555;
    }

    .key:active {
      transform: scale(0.92);
    }

    .instructions {
      color: #888;
      font-size: 0.75rem;
      text-align: center;
      margin-top: 18px;
    }
  </style>
</head>
<body>

    <div class="version-tag">ver 1.12</div>
  <div class="phone-container">
    <div id="display">
      <div id="screen-text">Welcome! Enter your code followed by #</div>
      <div id="input-buffer"></div>
    </div>

    <div class="keypad">
      <button class="key">1</button>
      <button class="key">2</button>
      <button class="key">3</button>
      <button class="key">4</button>
      <button class="key">5</button>
      <button class="key">6</button>
      <button class="key">7</button>
      <button class="key">8</button>
      <button class="key">9</button>
      <button class="key">*</button>
      <button class="key">0</button>
      <button class="key">#</button>
    </div>

    <div class="instructions">Press * to Clear / Back | Press # to Submit</div>
  </div>

  <script>
    const screenText = document.getElementById('screen-text');
    const inputBuffer = document.getElementById('input-buffer');
    const keys = document.querySelectorAll('.key');

    // 🗂️ Customer Database
    const customerDatabase = {
      "1": { name: "Alex", active: true, logs: [] },
      "2": { name: "Jordan", active: false, logs: [] }
    };

    // 🗓️ Month Info Map with Max Days per Month
    const monthInfo = {
      "01": { name: "January", maxDays: 31 },
      "02": { name: "February", maxDays: 28 },
      "03": { name: "March", maxDays: 31 },
      "04": { name: "April", maxDays: 30 },
      "05": { name: "May", maxDays: 31 },
      "06": { name: "June", maxDays: 30 },
      "07": { name: "July", maxDays: 31 },
      "08": { name: "August", maxDays: 31 },
      "09": { name: "September", maxDays: 30 },
      "10": { name: "October", maxDays: 31 },
      "11": { name: "November", maxDays: 30 },
      "12": { name: "December", maxDays: 31 }
    };

    // 🌳 Data-Driven Menu Tree Structure
    const menuTree = {
      "MAIN_MENU": {
        text: "Press 1 for Scheduling, Press 2 for entering a special code.",
        parent: null,
        options: {
          "1": "BOOK_SCHEDULE",
          "2": "SPECIAL_CODE"
        }
      },
      
      "BOOK_SCHEDULE": {
        text: "Press 1 to Book New Schedule. Press * to go back.",
        parent: "MAIN_MENU",
        options: {
          "1": "BOOK_NEW_SCHEDULE"
        }
      },
      // ⚡ Step 1: Collect Month (2 Digits)
      "BOOK_NEW_SCHEDULE": {
        text: "Enter a 2-digit month (01 for Jan, 05 for May, 12 for Dec). Press * to go back.",
        parent: "BOOK_SCHEDULE",
        type: "COLLECT_DIGITS",
        length: 2,
        nextState: "SELECT_DAY"
      },
      // ⚡ Step 2: Collect Day (2 Digits)
      "SELECT_DAY": {
        text: "Enter a 2-digit day. Press * to go back.",
        parent: "BOOK_NEW_SCHEDULE",
        type: "COLLECT_DIGITS",
        length: 2,
        nextState: "SCHEDULE_CONFIRMED"
      },
      // 🎯 Step 3: Confirmation
      "SCHEDULE_CONFIRMED": {
        text: "Your schedule has been confirmed! Press * to return.",
        parent: "MAIN_MENU",
        options: {}
      },
      
      "SPECIAL_CODE": {
        text: "Please enter your 4 digit code",
        parent: "MAIN_MENU",
        type: "COLLECT_DIGITS",
        length: 4,
        nextState: "SPECIAL_CODE"
      },
      "GAME_MODE": {
        text: "do you acknolage you have entered spi*ital* mode? press 1 for yes. press 2 for no. Press * to return.",
        parent: "SPECIAL_CODE",
        options: {
          "1": "SPI*ITA*_MODE",
          "2": "BACK_OUT"
        }
      },
      "BACK_OUT": {
        text: "you have backed out of your option. press 1 to go to menu. press 2 to book a schedule. press 3 to enter a code.",
        parent: "MAIN_MENU",
        options: {
          "1": "MAIN_MENU",
          "2": "BOOK_SCHEDULE",
          "3": "SPECIAL_CODE"
        }
      },
      "SPI*ITA*_MODE": {
        text: "You have entered into Spi*ital mode.",
        matrixVibe: true,
        parent: "",
        options: {
          "1": ""
        },
      },
      "": {
        text: "",
        parent: "",
        options: {
          "1": ""
        }
      },
      "": {
        text: "",
        parent: "",
        options: {
          "1": ""
        }
      },
      "": {
        text: "",
        parent: "",
        options: {
          "1": ""
        }
      },
      "": {
        text: "",
        parent: "",
        options: {
          "1": ""
        }
      },
      "": {
        text: "",
        parent: "",
        options: {
          "1": ""
        }
      }
    };

    let currentState = "IDLE";
    let activeCustomer = null;
    let currentInput = "";
    let selectedMonthKey = "";

    // 🔊 Text-To-Speech
    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 0.95;
        window.speechSynthesis.speak(utterance);
      }
    }

    // 🟢 Update Screen & Speak Function
  function updateDisplay(text) {
    screenText.textContent = text;

    // 🟢 Toggle Matrix effect based on menu property
    if (menuTree[currentState] && menuTree[currentState].matrixVibe) {
      screenText.classList.add("matrix-vibe");
    } else {
      screenText.classList.remove("matrix-vibe"); // Reset to standard text
    }

    speak(text);
  }

    // Keypad Listeners
    keys.forEach(key => {
      key.addEventListener('click', () => {
        handleKeyPress(key.textContent);
      });
    });

    // Main Router
    function handleKeyPress(val) {
      // 1. Admin State (View & Delete Customer Data)
      if (currentState === "ADMIN_MODE") {
        if (val === "*") {
          currentInput = "";
          inputBuffer.textContent = "";
          resetToIdle("Logged out of Admin Mode.");
        } else if (val === "#") {
          // Process Customer Deletion
          if (customerDatabase[currentInput]) {
            customerDatabase[currentInput].logs = [];
            updateDisplay(`Cleared logs for ID ${currentInput}!`);
          } else {
            updateDisplay(`ID ${currentInput} not found.`);
          }
          currentInput = "";
          inputBuffer.textContent = "";
          setTimeout(showAdminLogs, 1500); // Return to log display
        } else {
          currentInput += val;
          inputBuffer.textContent = currentInput;
        }
        return;
      }

      // 2. Identity Confirmation State
      if (currentState === "CONFIRM_IDENTITY") {
        handleIdentityConfirmation(val);
        return;
      }

      // 3. Customer Menu Navigation & Dynamic Digit Input State
      if (menuTree[currentState]) {
        handleMenuNavigation(val);
        return;
      }

      // 4. Default IDLE State Keypad Typing
      if (val === '*') {
        currentInput = "";
        inputBuffer.textContent = "";
      } else if (val === '#') {
        processCodeSubmission(currentInput);
        currentInput = "";
        inputBuffer.textContent = "";
      } else {
        currentInput += val;
        inputBuffer.textContent = currentInput;
      }
    }

    // Code Submission Handler
    function processCodeSubmission(code) {
      if (code === "9999") {
        currentState = "ADMIN_MODE";
        showAdminLogs();
        return;
      }

      const customer = customerDatabase[code];

      if (!customer) {
        updateDisplay("❌ Code Invalid. Please try again.");
      } else if (!customer.active) {
        updateDisplay("⚠️ Account Expired. Call support.");
      } else {
        activeCustomer = customer;
        currentState = "CONFIRM_IDENTITY";
        updateDisplay(`Hello, are you ${activeCustomer.name}? Press 1 for Yes, 2 for No.`);
      }
    }

    // Handle Identity Confirmation
    function handleIdentityConfirmation(val) {
      if (val === "1") {
        currentState = "MAIN_MENU";
        updateDisplay(menuTree["MAIN_MENU"].text);
      } else if (val === "2") {
        resetToIdle("Identity unconfirmed. Resetting system.");
      } else {
        updateDisplay("Invalid selection. Press 1 for Yes, 2 for No.");
      }
    }

    // Menu Navigation & Dynamic Collector Logic
    function handleMenuNavigation(val) {
      const currentMenu = menuTree[currentState];

      // Handle Back button '*'
      if (val === "*") {
        currentInput = "";
        inputBuffer.textContent = "";
        if (currentMenu.parent) {
          currentState = currentMenu.parent;
          updateDisplay(menuTree[currentState].text);
        } else {
          resetToIdle("Logged out. Welcome! Enter your code followed by #");
        }
        return;
      }

      // ⚡ Handle Dynamic Input Collection Mode
      if (currentMenu.type === "COLLECT_DIGITS") {
        if (val >= "0" && val <= "9") {
          currentInput += val;
          inputBuffer.textContent = currentInput; // 👈 Shows typed digit instantly!

          if (currentInput.length === currentMenu.length) {
            
            // 🗓️ 1. Handling Month Selection
            if (currentState === "BOOK_NEW_SCHEDULE") {
              const selectedData = monthInfo[currentInput];
              if (selectedData) {
                selectedMonthKey = currentInput; // Store selected month
                if (activeCustomer) activeCustomer.logs.push(`Month: ${selectedData.name}`);
                currentInput = "";
                inputBuffer.textContent = "";
                currentState = currentMenu.nextState;
                updateDisplay(`Selected ${selectedData.name}! ${menuTree[currentState].text}`);
              } else {
                currentInput = "";
                inputBuffer.textContent = "";
                updateDisplay("❌ Invalid month (01-12). Re-enter 2-digit month.");
              }
            } 
            
            // 📆 2. Handling Day Selection
            else if (currentState === "SELECT_DAY") {
              const dayNum = parseInt(currentInput, 10);
              const maxAllowedDays = monthInfo[selectedMonthKey]?.maxDays || 31;

              if (dayNum >= 1 && dayNum <= maxAllowedDays) {
                if (activeCustomer) activeCustomer.logs.push(`Day: ${currentInput}`);
                currentInput = "";
                inputBuffer.textContent = "";
                currentState = currentMenu.nextState;
                updateDisplay(`Day ${currentInput} saved! ${menuTree[currentState].text}`);
              } else {
                const monthName = monthInfo[selectedMonthKey]?.name || "this month";
                currentInput = "";
                inputBuffer.textContent = "";
                updateDisplay(`❌ Invalid day. ${monthName} only has ${maxAllowedDays} days.`);
              }
            }
            
            // 🔒 3. Handling 4-Digit Special Code
            else if (currentState === "SPECIAL_CODE") {
              if (currentInput === "2983") {
                updateDisplay("✅ Access Granted! Redirecting. do you acknolage you have entered spi*ital* mode? press 1 for yes. press 2 for no.");
                currentState = "GAME_MODE";
              } else {
                updateDisplay("❌ Incorrect Code. Try again.");
              }
              currentInput = "";
              inputBuffer.textContent = "";
            }

          }
        }
        return;
      }

      // Standard Option Navigation
      if (currentMenu.options && currentMenu.options[val]) {
        if (activeCustomer) {
          activeCustomer.logs.push(val);
        }
        currentState = currentMenu.options[val];
        updateDisplay(menuTree[currentState].text);
      } else {
        updateDisplay("Invalid option. " + currentMenu.text);
      }
    }

    // Display Admin Logs
    function showAdminLogs() {
      let summary = "📊 CUSTOMER LOGS:\n";

      for (let id in customerDatabase) {
        const cust = customerDatabase[id];
        const logHistory = cust.logs.length > 0 ? cust.logs.join(" > ") : "No activity";
        summary += `${cust.name} (${id}): [${logHistory}]\n`;
      }

      summary += "\nType ID + # to clear logs. Press * to exit.";
      updateDisplay(summary);
    }

    // Reset System
    function resetToIdle(message) {
      currentState = "IDLE";
      activeCustomer = null;
      currentInput = "";
      selectedMonthKey = "";
      inputBuffer.textContent = "";
      updateDisplay(message || "Welcome! Enter your code followed by #");
    }
  </script>

</body>
</html>
