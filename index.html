<script>
  // DOM Elements
  const screenText = document.getElementById('screen-text');
  const inputBuffer = document.getElementById('input-buffer');
  const keys = document.querySelectorAll('.key');

  // Customer Database
  const customerDatabase = {
    "1001": {
      name: "Alex",
      active: true,
      customPrompt: "Press 1 for Order Status, Press 2 for Billing."
    },
    "1002": {
      name: "Jordan",
      active: false,
      customPrompt: "Press 1 for Account Renewal."
    }
  };

  // State & Buffer Variables
  let currentState = "IDLE";
  let activeCustomer = null;
  let currentInput = "";

  // 🔊 Text-To-Speech Function
  function speak(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel(); // Stop talking if currently speaking
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 0.95;
      window.speechSynthesis.speak(utterance);
    }
  }

  // Update Display & Speak Message
  function updateDisplay(text) {
    screenText.textContent = text;
    speak(text);
  }

  // Keypad Click Listeners
  keys.forEach(key => {
    key.addEventListener('click', () => {
      const val = key.textContent;
      handleKeyPress(val);
    });
  });

  // Main Keypress Handling
  function handleKeyPress(val) {
    // Handling based on currentState
    if (currentState === "CONFIRM_IDENTITY") {
      handleIdentityConfirmation(val);
      return;
    }

    // Default digit buffer handling for IDLE state
    if (val === '*') {
      currentInput = "";
      inputBuffer.textContent = "";
    } else if (val === '#') {
      processCodeSubmission(currentInput);
      currentInput = "";
      inputBuffer.textContent = "";
    } else {
      currentInput += val;
      inputBuffer.textContent = currentInput;
    }
  }

  // Process Code Submission (# key)
  function processCodeSubmission(code) {
    const customer = customerDatabase[code];

    if (!customer) {
      updateDisplay("❌ Code Invalid. Please try again.");
    } else if (!customer.active) {
      updateDisplay("⚠️ Account Expired. Call support.");
    } else {
      // Valid user found!
      activeCustomer = customer;
      currentState = "CONFIRM_IDENTITY";
      updateDisplay(`Hello ${activeCustomer.name}! Press 1 for Yes, 2 for No.`);
    }
  }

  // Handle Yes (1) or No (2) during Identity Confirmation
  function handleIdentityConfirmation(val) {
    if (val === "1") {
      // Yes -> Move to Customer Menu
      currentState = "CUSTOMER_MENU";
      const menuText = activeCustomer.customPrompt || "Welcome to your account menu.";
      updateDisplay(menuText);
    } else if (val === "2") {
      // No -> Reset back to IDLE
      resetToIdle("Identity unconfirmed. Resetting system.");
    } else {
      updateDisplay("Invalid selection. Press 1 for Yes, 2 for No.");
    }
  }

  // Reset System to IDLE
  function resetToIdle(message) {
    currentState = "IDLE";
    activeCustomer = null;
    currentInput = "";
    inputBuffer.textContent = "";
    updateDisplay(message || "Welcome! Enter your code followed by #");
  }
</script>
