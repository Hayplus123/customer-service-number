<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Automated Phone System</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f0f2f5;
      font-family: sans-serif;
    }

    .phone-container {
      width: 320px;
      background-color: #1a1a1a;
      padding: 25px;
      border-radius: 25px;
      box-shadow: 0px 10px 25px rgba(0,0,0,0.3);
    }

    #display {
      background-color: #000;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      margin-bottom: 25px;
      border: 2px solid #333;
    }

    #screen-text {
      font-size: 0.95rem;
      color: #00ff66;
      margin-bottom: 10px;
      min-height: 3.5em;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.3;
      white-space: pre-line;
    }

    #input-buffer {
      font-size: 1.6rem;
      color: #ffffff;
      font-weight: bold;
      letter-spacing: 3px;
      min-height: 1.4em;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .key {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      border: none;
      background-color: #333;
      color: white;
      font-size: 1.4rem;
      font-weight: bold;
      cursor: pointer;
      justify-self: center;
      transition: background-color 0.2s, transform 0.1s;
    }

    .key:hover {
      background-color: #555;
    }

    .key:active {
      transform: scale(0.92);
    }

    .instructions {
      color: #888;
      font-size: 0.75rem;
      text-align: center;
      margin-top: 18px;
    }
  </style>
</head>
<body>

  <div class="phone-container">
    <div id="display">
      <div id="screen-text">Welcome! Enter your code followed by #</div>
      <div id="input-buffer"></div>
    </div>

    <div class="keypad">
      <button class="key">1</button>
      <button class="key">2</button>
      <button class="key">3</button>
      <button class="key">4</button>
      <button class="key">5</button>
      <button class="key">6</button>
      <button class="key">7</button>
      <button class="key">8</button>
      <button class="key">9</button>
      <button class="key">*</button>
      <button class="key">0</button>
      <button class="key">#</button>
    </div>

    <div class="instructions">Press * to Clear / Back | Press # to Submit</div>
  </div>

  <script>
    const screenText = document.getElementById('screen-text');
    const inputBuffer = document.getElementById('input-buffer');
    const keys = document.querySelectorAll('.key');

    // 🗂️ Customer Database (with response logs array)
    const customerDatabase = {
      "1": { name: "Alex", active: true, logs: [] },
      "2": { name: "Jordan", active: true, logs: [] }
    };

    // 🌳 Data-Driven Menu Tree Structure
    const menuTree = {
      "MAIN_MENU": {
        text: "Press 1 for booking schedule, Press 2 for Support.",
        parent: null,
        options: {
          "1": "BOOK_SCHEDULE",
          "2": ""
        }
      },
      "BOOK_SCHEDULE": {
        text: "you have pressed booking schedule. Press 1 for booking a new schedule. Press * to go back.",
        parent: "MAIN_MENU",
        options: {
          "1": "BOOK_NEW_SCHEDULE"
        }
      },
      "BOOK_NEW_SCHEDULE": {
        text: "Press the month you would like to book a schedule. If the month is one digit press 0 Press * to go back.",
        parent: "BOOK_SCHEDULE",
        options: {
          "0": "BLANK_MONTH",
          "1": "MONTH_START_WITH_ONE"
        }
      },
      "BLANK_MONTH": {
        text: "You have pressed 0. please enter your second number of the month. Press * to return.",
        parent: "BOOK_NEW_SCHEDULE",
        options: {
            "1": "JAN",
            "2": "FEB",
            "3": "MAR",
            "4": "APR",
            "5": "MAY",
            "6": "JUN",
            "7": "JUL",
            "8": "AUG",
            "9": "SEP",
        }
      },
      "JAN": {
        text: "To cancel, visit our website. Press * to return.",
        parent: "ORDER_MENU",
        options: {}
      },
      "FEB": {
        text: "Tech support is active. Press * to return.",
        parent: "SUPPORT_MENU",
        options: {}
      },
      "MAR": {
        text: "Transferring to representative... Press * to return.",
        parent: "SUPPORT_MENU",
        options: {}
      },
      "APR": {
        text: "Transferring to representative... Press * to return.",
        parent: "SUPPORT_MENU",
        options: {}
      },
      "MAY": {
        text: "Transferring to representative... Press * to return.",
        parent: "SUPPORT_MENU",
        options: {}
      },
      "JUN": {
        text: "Transferring to representative... Press * to return.",
        parent: "SUPPORT_MENU",
        options: {}
      },
      "JUL": {
        text: "Transferring to representative... Press * to return.",
        parent: "SUPPORT_MENU",
        options: {}
      },
      "AUG": {
        text: "Transferring to representative... Press * to return.",
        parent: "SUPPORT_MENU",
        options: {}
      },
      "SEP": {
        text: "Transferring to representative... Press * to return.",
        parent: "SUPPORT_MENU",
        options: {}
      },
      "": {
        text: "Transferring to representative... Press * to return.",
        parent: "SUPPORT_MENU",
        options: {}
      },
      "": {
        text: "Transferring to representative... Press * to return.",
        parent: "SUPPORT_MENU",
        options: {}
      },
      "": {
        text: "Transferring to representative... Press * to return.",
        parent: "SUPPORT_MENU",
        options: {}
      },
      "": {
        text: "Transferring to representative... Press * to return.",
        parent: "SUPPORT_MENU",
        options: {}
      },
      "": {
        text: "Transferring to representative... Press * to return.",
        parent: "SUPPORT_MENU",
        options: {}
      },
      "": {
        text: "Transferring to representative... Press * to return.",
        parent: "SUPPORT_MENU",
        options: {}
      },
      "": {
        text: "Transferring to representative... Press * to return.",
        parent: "SUPPORT_MENU",
        options: {}
      },
      "": {
        text: "Transferring to representative... Press * to return.",
        parent: "SUPPORT_MENU",
        options: {}
      },
      "": {
        text: "Transferring to representative... Press * to return.",
        parent: "SUPPORT_MENU",
        options: {}
      }
    };

    let currentState = "IDLE";
    let activeCustomer = null;
    let currentInput = "";

    // 🔊 Text-To-Speech
    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 0.95;
        window.speechSynthesis.speak(utterance);
      }
    }

    // Update Screen & Speak Text
    function updateDisplay(text) {
      screenText.textContent = text;
      speak(text);
    }

    // Keypad Event Listeners
    keys.forEach(key => {
      key.addEventListener('click', () => {
        handleKeyPress(key.textContent);
      });
    });

    // Main Router
    function handleKeyPress(val) {
      // 1. Admin State
      if (currentState === "ADMIN_MODE") {
        if (val === "*") {
          resetToIdle("Logged out of Admin Mode.");
        }
        return;
      }

      // 2. Identity Confirmation State
      if (currentState === "CONFIRM_IDENTITY") {
        handleIdentityConfirmation(val);
        return;
      }

      // 3. Customer Navigation State
      if (menuTree[currentState]) {
        handleMenuNavigation(val);
        return;
      }

      // 4. Keypad Typing (IDLE State)
      if (val === '*') {
        currentInput = "";
        inputBuffer.textContent = "";
      } else if (val === '#') {
        processCodeSubmission(currentInput);
        currentInput = "";
        inputBuffer.textContent = "";
      } else {
        currentInput += val;
        inputBuffer.textContent = currentInput;
      }
    }

    // Code Submission Handler (# key)
    function processCodeSubmission(code) {
      // Check Admin Code
      if (code === "9999") {
        currentState = "ADMIN_MODE";
        showAdminLogs();
        return;
      }

      // Check Customer Code
      const customer = customerDatabase[code];

      if (!customer) {
        updateDisplay("❌ Code Invalid. Please try again.");
      } else if (!customer.active) {
        updateDisplay("⚠️ Account Expired. Call support.");
      } else {
        activeCustomer = customer;
        currentState = "CONFIRM_IDENTITY";
        updateDisplay(`Hello just to confirm, are you ${activeCustomer.name}? Press 1 for Yes, 2 for No.`);
      }
    }

    // Handle Yes (1) / No (2)
    function handleIdentityConfirmation(val) {
      if (val === "1") {
        currentState = "MAIN_MENU";
        updateDisplay(menuTree["MAIN_MENU"].text);
      } else if (val === "2") {
        resetToIdle("Identity unconfirmed. Resetting system.");
      } else {
        updateDisplay("Invalid selection. Press 1 for Yes, 2 for No.");
      }
    }

    // Handle Sub-Menu Navigation & Logging 📝
    function handleMenuNavigation(val) {
      const currentMenu = menuTree[currentState];

      if (val === "*") {
        if (currentMenu.parent) {
          currentState = currentMenu.parent;
          updateDisplay(menuTree[currentState].text);
        } else {
          resetToIdle("Logged out. Welcome! Enter your code followed by #");
        }
      } else if (currentMenu.options[val]) {
        // Log selection
        if (activeCustomer) {
          activeCustomer.logs.push(val);
        }
        currentState = currentMenu.options[val];
        updateDisplay(menuTree[currentState].text);
      } else {
        updateDisplay("Invalid option. " + currentMenu.text);
      }
    }

    // Display Admin Logs 📊
    function showAdminLogs() {
      let summary = "📊 CUSTOMER LOGS:\n";

      for (let id in customerDatabase) {
        const cust = customerDatabase[id];
        const logHistory = cust.logs.length > 0 ? cust.logs.join(" > ") : "No activity";
        summary += `${cust.name} (${id}): [${logHistory}]\n`;
      }

      summary += "\nPress * to exit.";
      updateDisplay(summary);
    }

    // Reset System
    function resetToIdle(message) {
      currentState = "IDLE";
      activeCustomer = null;
      currentInput = "";
      inputBuffer.textContent = "";
      updateDisplay(message || "Welcome! Enter your code followed by #");
    }
  </script>

</body>
</html>
